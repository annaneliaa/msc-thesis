[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msc-thesis"
version = "0.1.0"
description = "MSc thesis system for hybrid symbolic-neural intrusion detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "typer>=0.12",
  "pandas>=2.2",
  "mlflow>=2.12",
  "matplotlib-venn>=0.11",
  "transformers",
  "datasets",
  "numpy>=1.0,<2.0",
  "scikit-learn",
  "scipy",
  "jupyter",
  "ipywidgets",
  "torch",
  "tensordict",
  "python-dotenv",
  "accelerate>=1.1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "black>=24.0",
  "pre-commit>=3.8",
]
# graph-tool is required for AlertBERT grouping but is not pip-installable.
# Install it via conda before pip install -e .:
#   mamba install -c conda-forge graph-tool

[project.scripts]
thesis-cli = "thesis.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
exclude = [
  "*.ipynb",
  ".venv",
  "__pycache__",
]

[tool.pytest.ini_options]
testpaths = ["tests"]