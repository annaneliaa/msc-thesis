[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msc-thesis"
version = "0.1.0"
description = "MSc thesis system for hybrid symbolic-neural intrusion detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "typer>=0.12",
  "pandas>=2.2",
  "matplotlib-venn>=0.11",
  "transformers>=4.48",  # ModernBERT support (cscas_securebert.py's SecureBERT 2.0 checkpoint), added in 4.48
  "datasets",
  "numpy>=1.0,<2.0",
  "scikit-learn",
  "xgboost",
  "scipy",
  "jupyter",
  "ipywidgets",
  "torch",
  "tensordict",
  "python-dotenv",
  "accelerate>=1.1.0",
  "shap",
  "lime",
  "deepcase @ git+https://github.com/Thijsvanede/DeepCASE.git@7d19eaa798da257b83567aeaed78d88bd3574370",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "black>=24.0",
  "pre-commit>=3.8",
]
# graph-tool is required for AlertBERT grouping but is not pip-installable.
# Install it via conda before pip install -e .:
#   mamba install -c conda-forge graph-tool

# cuml (RAPIDS) is required for the "rf_gpu" model (training/gpu_models.py's
# CuMLRandomForestClassifierWrapper) but is Linux+NVIDIA-only, so it's NOT
# listed as a base/optional dependency here -- doing so would break
# `pip install -e .` on macOS. Install separately, only on a CUDA machine
# (e.g. inside Dockerfile.dgx's container):
#   pip install cuml-cu12
#   # or: mamba install -c rapidsai -c conda-forge -c nvidia cuml
# training/gpu_models.py imports cuml lazily (inside the wrapper's fit(),
# not at module import time) specifically so model_factory.py -- imported by
# nearly every training code path -- stays importable without it. Every
# other model_factory entry ("xgboost", "torch_nn", etc.) works with only
# this project's existing base dependencies.

[project.scripts]
thesis-cli = "thesis.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
exclude = [
  "*.ipynb",
  ".venv",
  "__pycache__",
]

[tool.pytest.ini_options]
testpaths = ["tests"]