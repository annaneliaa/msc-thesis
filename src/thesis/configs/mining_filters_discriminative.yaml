# Discriminative filter.
# Keeps patterns that clearly separate the two classes by support difference
# and confidence. Good for building a feature vocabulary for a classifier.
# Redundant sub-patterns are removed.

itemsets:
  min_k: 2
  max_k: null
  min_support_count: 30       # at least ~0.3% of transactions (with 10k tx)
  min_abs_support_diff: 0.10  # at least 10 percentage point gap between classes
  min_confidence_attack: 0.0
  min_confidence_benign: 0.0
  remove_subsumed: true       # drop {A,B} when {A,B,C} also passes

item_sequences:
  min_k: 3                    # k=1 useless, k=2 weak signal
  min_support_count: 30
  min_abs_support_diff: 0.10
  min_confidence_attack: 0.0
  min_confidence_benign: 0.0
  min_lift: null
  remove_subsumed: true       # drop A->B when A->B->C also passes
