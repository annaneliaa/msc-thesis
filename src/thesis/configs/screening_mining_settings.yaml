# Named (mining_setting x granularity) axis for the in-window screening sweep
# (src/thesis/experiments/screening_sweep.py). Each entry is one point in
# the (mining_setting x granularity) grid: a name plus overrides for the
# two-stage attribute mining pipeline's thresholds (contrast-set filter +
# decision-tree rule extraction -- see schemas.mining.AttributeMiningConfig).
# Fields left out fall back to AttributeMiningConfig's defaults.
#
# This is the SHORTLIST from attribute_mining_sweep_eda.ipynb's two-tree
# feasible-region analysis (section 5.3), not a fresh grid search -- every
# entry below already clears both quality floors on the mining-structural
# metrics alone (mean_tree_precision_attack >= 0.65, mean_tree_recall_benign
# >= 0.5), exported to
# artifacts/experiments/attribute_mining_parameter_grid/feasible_configs_all.csv.
# Promoting them here runs each through the REAL evaluation pipeline (screening
# models, not just leaf-level precision/recall) to see which structural passes
# hold up. This replaces the old single-tree min_growth_rate x max_depth grid
# (mirrored from shell-scripts/sweep_attribute_schema.sh) -- that grid predates
# the two-tree redesign (DecisionTreeRuleConfig.max_depth_attack /
# ContrastSetFilterConfig.min_growth_rate_attack) and is no longer representative
# of how this pipeline mines.
#
# max_depth=2 entries (md2_*) passed the recall_benign floor only narrowly and
# with much higher across-window variance than max_depth=1 (0.546, std 0.123 vs.
# 0.988-0.990, std 0.005 -- see the notebook's section 5.3 addendum) -- kept in
# the shortlist rather than pre-filtered out, since that's exactly the kind of
# near-miss this real evaluation pass should be the one to confirm or reject.
#
# Granularity (that script's MINE_FRACS) is the sweep's other, separate axis --
# pass it via run_screening_sweep.py's --granularities, not here, e.g.:
#   --granularities 0.1 0.2 0.33 0.5 1.0

settings:
  - name: gr3_md1_mda2
    contrast:
      min_growth_rate: 3
      min_attack_coverage: 0.05
      min_benign_coverage: 0.05
    tree:
      max_depth: 1
      max_depth_attack: 2
      class_weight: "balanced"
      min_samples_leaf: 20

  - name: gr3_md1_mda3
    contrast:
      min_growth_rate: 3
      min_attack_coverage: 0.05
      min_benign_coverage: 0.05
    tree:
      max_depth: 1
      max_depth_attack: 3
      class_weight: "balanced"
      min_samples_leaf: 20

  - name: gr3_md1_mda4
    contrast:
      min_growth_rate: 3
      min_attack_coverage: 0.05
      min_benign_coverage: 0.05
    tree:
      max_depth: 1
      max_depth_attack: 4
      class_weight: "balanced"
      min_samples_leaf: 20

  - name: gr3_md2_mda2
    contrast:
      min_growth_rate: 3
      min_attack_coverage: 0.05
      min_benign_coverage: 0.05
    tree:
      max_depth: 2
      max_depth_attack: 2
      class_weight: "balanced"
      min_samples_leaf: 20

  - name: gr3_md2_mda3
    contrast:
      min_growth_rate: 3
      min_attack_coverage: 0.05
      min_benign_coverage: 0.05
    tree:
      max_depth: 2
      max_depth_attack: 3
      class_weight: "balanced"
      min_samples_leaf: 20

  - name: gr3_md2_mda4
    contrast:
      min_growth_rate: 3
      min_attack_coverage: 0.05
      min_benign_coverage: 0.05
    tree:
      max_depth: 2
      max_depth_attack: 4
      class_weight: "balanced"
      min_samples_leaf: 20
