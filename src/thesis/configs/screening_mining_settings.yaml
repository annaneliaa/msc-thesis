# THE downstream parameter grid. Each entry is one named point in the
# (mining_setting x granularity) grid: a name plus overrides for the
# two-stage attribute mining pipeline's thresholds (contrast-set filter +
# decision-tree rule extraction -- see schemas.mining.AttributeMiningConfig).
# Fields left out fall back to AttributeMiningConfig's defaults.
#
# This file is the single input to every system-eval experiment that takes a
# mining grid:
#   - run_screening_sweep.py          (in-window screening)
#   - run_temporal_decay.py           (Exp 2, rolling-horizon decay)
#   - run_rolling_walk_forward.py     (Exp 3, always-retrain anchor)
#   - run_monitor_drift.py            (Exp 4, drift monitor, observe-only)
# Each of those crosses every entry here with its own --granularities x
# --models (+ a baseline row per granularity). There is no intermediate
# feasible-config CSV and no separate real-evaluation ranking step -- to
# change what those experiments evaluate, edit this file.
#
# The current entries are the two-tree feasible set from
# attribute_mining_sweep_eda.ipynb (section 5.3 / 6.3): max_depth in {1,2} x
# max_depth_attack in {2,3,4} at the growth_rate=3 / coverage=0.05 /
# class_weight=balanced anchor -- every one clears both mining-structural
# floors (mean_tree_precision_attack >= 0.65, mean_tree_recall_benign >= 0.5).
# The max_depth=2 entries (md2_*) clear the recall_benign floor only narrowly
# and with much higher across-window variance (0.546, std 0.123 vs. 0.99, std
# 0.005 -- section 5.3 addendum) -- kept in the grid rather than pre-filtered
# out, since the real evaluation is the right place to confirm or reject that
# near-miss.
#
# min_samples_leaf is 10 (EDA section 5.4: +0.02-0.03 precision_attack over 20
# at no other cost). The mining-sweep script keeps its own anchor at 20 -- msl
# is ~inert on every other axis there, and the sweep mines through a different
# cache key than these experiments, so the two need not match.

settings:
  - name: gr3_md1_mda2
    contrast:
      min_growth_rate: 3
      min_attack_coverage: 0.05
      min_benign_coverage: 0.05
    tree:
      max_depth: 1
      max_depth_attack: 2
      class_weight: "balanced"
      min_samples_leaf: 10

  - name: gr3_md1_mda3
    contrast:
      min_growth_rate: 3
      min_attack_coverage: 0.05
      min_benign_coverage: 0.05
    tree:
      max_depth: 1
      max_depth_attack: 3
      class_weight: "balanced"
      min_samples_leaf: 10

  - name: gr3_md1_mda4
    contrast:
      min_growth_rate: 3
      min_attack_coverage: 0.05
      min_benign_coverage: 0.05
    tree:
      max_depth: 1
      max_depth_attack: 4
      class_weight: "balanced"
      min_samples_leaf: 10

  - name: gr3_md2_mda2
    contrast:
      min_growth_rate: 3
      min_attack_coverage: 0.05
      min_benign_coverage: 0.05
    tree:
      max_depth: 2
      max_depth_attack: 2
      class_weight: "balanced"
      min_samples_leaf: 10

  - name: gr3_md2_mda3
    contrast:
      min_growth_rate: 3
      min_attack_coverage: 0.05
      min_benign_coverage: 0.05
    tree:
      max_depth: 2
      max_depth_attack: 3
      class_weight: "balanced"
      min_samples_leaf: 10

  - name: gr3_md2_mda4
    contrast:
      min_growth_rate: 3
      min_attack_coverage: 0.05
      min_benign_coverage: 0.05
    tree:
      max_depth: 2
      max_depth_attack: 4
      class_weight: "balanced"
      min_samples_leaf: 10

  # Diverse-round mining (decision_tree_rule_mining._fit_class_rounds):
  # after the benign/attack trees above are fit, each is refit once more
  # with its already-used feature column(s) excluded, on the same
  # population, to surface a second (and third) independent
  # characterization instead of just the dominant one. Validated on the
  # CSCAS classifier baseline (same-window F1): rounds=2 beat rounds=1 on
  # every pool condition; rounds=3 beat rounds=1 too but underperformed
  # rounds=2 on every metric there (its added rule was individually
  # significant but redundant in signal with rounds=2's winning rule).
  # That comparison was same-window fit quality only, not drift robustness
  # -- kept here at rounds=3 specifically because temporal_decay is what
  # can tell us whether rounds=3's thinner-support rule decays faster (or
  # slower) than rounds=2's, which a same-window F1 check can't answer.
  #
  # Crossed with just the two most relevant depth points rather than the
  # full 6-point grid, to keep this addition's cost down: gr3_md1_mda4 (the
  # config actually adopted into cscas_mining.py's two_tree point) and
  # gr3_md2_mda4 (the other max_depth_attack=4 point, to check whether a
  # deeper benign tree changes the round-stability story too). The other 4
  # depth points above are left at their implicit rounds=1 (unset ->
  # DecisionTreeRuleConfig default) as an unchanged reference curve.
  #
  # round_min_coverage/round_min_growth_rate (the round>=2 significance
  # floor) are set equal to this entry's own contrast.min_attack_coverage/
  # min_growth_rate rather than swept independently -- same anchor-not-axis
  # treatment this file already gives every other Step-1-style threshold.
  - name: gr3_md1_mda4_rounds2
    contrast:
      min_growth_rate: 3
      min_attack_coverage: 0.05
      min_benign_coverage: 0.05
    tree:
      max_depth: 1
      max_depth_attack: 4
      class_weight: "balanced"
      min_samples_leaf: 10
      max_diverse_rounds: 2
      round_min_coverage: 0.05
      round_min_growth_rate: 3

  - name: gr3_md1_mda4_rounds3
    contrast:
      min_growth_rate: 3
      min_attack_coverage: 0.05
      min_benign_coverage: 0.05
    tree:
      max_depth: 1
      max_depth_attack: 4
      class_weight: "balanced"
      min_samples_leaf: 10
      max_diverse_rounds: 3
      round_min_coverage: 0.05
      round_min_growth_rate: 3

  - name: gr3_md2_mda4_rounds2
    contrast:
      min_growth_rate: 3
      min_attack_coverage: 0.05
      min_benign_coverage: 0.05
    tree:
      max_depth: 2
      max_depth_attack: 4
      class_weight: "balanced"
      min_samples_leaf: 10
      max_diverse_rounds: 2
      round_min_coverage: 0.05
      round_min_growth_rate: 3

  - name: gr3_md2_mda4_rounds3
    contrast:
      min_growth_rate: 3
      min_attack_coverage: 0.05
      min_benign_coverage: 0.05
    tree:
      max_depth: 2
      max_depth_attack: 4
      class_weight: "balanced"
      min_samples_leaf: 10
      max_diverse_rounds: 3
      round_min_coverage: 0.05
      round_min_growth_rate: 3
