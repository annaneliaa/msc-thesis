# Minimal post-mining filter.
# Removes only the most obvious noise: singletons and near-zero-occurrence patterns.
# Use initial exploration or for inspecting the full result space.

itemsets:
  min_k: 2                    # drop singleton itemsets (single alert types)
  max_k: null                 # no upper bound
  min_support_count: 10       # must appear in at least 10 transactions
  min_abs_support_diff: 0.0   # no discriminativeness requirement
  min_confidence_attack: 0.0
  max_confidence_attack: null # no upper bound on attack confidence
  min_confidence_benign: 0.0
  max_overlap: null           # no overlap filter — keep full result space for exploration
  remove_subsumed: false      # keep all sizes for inspection

item_sequences:
  min_k: 3                  
  min_support_count: 10
  min_abs_support_diff: 0.0
  min_confidence_attack: 0.0
  max_confidence_attack: null # no upper bound on attack confidence
  min_confidence_benign: 0.0
  min_lift: null              # no novelty filter
  max_overlap: null           # no overlap filter
  remove_subsumed: false

or_features:
  min_abs_support_diff: 0.0   # no additional filter — OR mining already applies 0.05
  min_confidence_attack: 0.0
  max_confidence_attack: null
  min_confidence_benign: 0.0
  max_n_clauses: null         # no arity limit

feature_selection:
  top_k: null                 # no limit
  min_utility_score: null     # no threshold
  filter_cross_host_or: true  # drop OR features that span distinct hosts
