# Dedup-only filter.
#
# mining_filters_simple.yaml's min_abs_support_diff=0.30 was tuned against
# ait-ads and turns out far too strict for cscas — it drops almost everything
# as "uniform noise" (T4 diagnostic in run_mining_window_sweep) rather than
# genuinely redundant patterns, leaving ~20 surviving features.
#
# This config keeps only the subset-redundancy pruning (remove_subsumed),
# which collapses combinatorial itemset/sequence duplicates (e.g. every
# subset of a token group that always co-occurs) without discarding
# statistically weak but non-redundant patterns. Class-separation bars are
# set low, just enough to drop truly non-discriminative (support_diff ~ 0)
# candidates — the symbolic experiment's own direction filter already
# enforces min_support_diff=0.05 on top of this.

itemsets:
  min_k: 1
  max_k: null
  min_support_count: 10
  min_abs_support_diff: 0.05
  min_confidence_attack: 0.0
  max_confidence_attack: null
  min_confidence_benign: 0.0
  max_overlap: null
  remove_subsumed: true

item_sequences:
  min_k: 3
  min_support_count: 10
  min_abs_support_diff: 0.05
  min_confidence_attack: 0.0
  max_confidence_attack: null
  min_confidence_benign: 0.0
  min_lift: null
  max_overlap: null
  remove_subsumed: true
  top_k_per_pass: 500        # perf cap, not a quality filter

or_features:
  min_abs_support_diff: 0.05
  min_confidence_attack: 0.0
  max_confidence_attack: null
  min_confidence_benign: 0.0
  max_n_clauses: null

feature_selection:
  top_k: null
  min_utility_score: null
  filter_cross_host_or: true
