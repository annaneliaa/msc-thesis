# Benign-focused filter.
# Keeps patterns that predominantly occur in benign transactions.
# confidence_benign = support_benign / (support_benign + support_attack),
# so 0.65 means the pattern appears in benign traffic at least 65% of the time.
#
# Use when the goal is FP reduction: the model learns "what normal looks like"
# and uses benign-pattern presence to suppress false positives.
# Complements attack_focused, which targets the opposite end of the confidence axis.

itemsets:
  min_k: 2
  max_k: null
  min_support_count: 20       # must be frequent enough to be meaningful
  min_abs_support_diff: 0.05  # some class separation required
  min_confidence_attack: 0.0
  max_confidence_attack: null
  min_confidence_benign: 0.65 # pattern must appear in benign traffic >= 65% of the time
  max_overlap: null           # confidence threshold already limits cross-class overlap
  remove_subsumed: true

item_sequences:
  min_k: 3
  min_support_count: 20
  min_abs_support_diff: 0.05
  min_confidence_attack: 0.0
  max_confidence_attack: null
  min_confidence_benign: 0.65
  min_lift: null
  max_overlap: null
  remove_subsumed: true

or_features:
  min_abs_support_diff: 0.05
  min_confidence_attack: 0.0
  max_confidence_attack: null
  min_confidence_benign: 0.65 # must be benign-leaning, matching itemset threshold
  max_n_clauses: null

feature_selection:
  top_k: null
  min_utility_score: null
  filter_cross_host_or: true  # drop OR features that span distinct hosts
