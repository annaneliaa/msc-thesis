# Simple filter: bulk reduction by support count and class separation only.
#
# Key levers:
#   min_support_count    — pattern must appear in at least N transactions
#                          (absolute count, independent of dataset size)
#   min_abs_support_diff — minimum gap between support_attack and support_benign
#   remove_subsumed      — for sequences: drop shorter patterns fully covered by
#                          a longer one (large reduction, little information loss)

itemsets:
  min_k: 2
  max_k: null
  min_support_count: 10        
  min_abs_support_diff: 0.30
  min_confidence_attack: 0.0
  max_confidence_attack: null
  min_confidence_benign: 0.0
  max_overlap: null
  remove_subsumed: true

item_sequences:
  min_k: 3
  min_support_count: 100        # higher bar for sequences because far more candidates
  min_abs_support_diff: 0.30    # 20pp class separation
  min_confidence_attack: 0.0
  max_confidence_attack: null
  min_confidence_benign: 0.0
  min_lift: 0.2
  max_overlap: 0.3
  remove_subsumed: true
  top_k_per_pass: 500         # cap patterns per mining pass before cross-label support (perf)

or_features:
  min_abs_support_diff: 0.20
  min_confidence_attack: 0.0
  max_confidence_attack: null
  min_confidence_benign: 0.0
  max_n_clauses: null

feature_selection:
  top_k: null
  min_utility_score: null
  filter_cross_host_or: true # Drop patterns like (smtp.gmail.com → AUTH) OR (smtp.outlook.com → AUTH) = any host doest AUTH
